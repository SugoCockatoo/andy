<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Base - Andy</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdf6ec;
            --text-dark: #3a2e2b;
            --text-muted: #66554e;
            --accent-orange: #d97736;
            --accent-light-orange: #fcebd9;
            --card-bg: #fffbf7;
            --card-border: #f3e5d8;
            --sidebar-dark: #3e2d24;
            --sidebar-active-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            color: var(--text-dark);
        }

        /* --- Decorative Cloud --- */
        .cloud-decoration {
            position: absolute;
            top: 25px;
            right: 50px;
            width: 110px;
            height: 38px;
            background-color: #f8ded0;
            border-radius: 20px;
            opacity: 0.35;
            pointer-events: none;
        }

        /* --- Left Fixed Sidebar --- */
        .sidebar {
            width: 90px;
            background-color: var(--sidebar-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 0;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .mascot-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .mascot-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-item {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
            color: inherit;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .nav-item img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .nav-item.active {
            background-color: var(--sidebar-active-bg);
        }

        .icon-svg {
            width: 22px;
            height: 22px;
            fill: var(--accent-orange);
        }

        /* --- Main Layout Workspace --- */
        .page-wrapper {
            flex: 1;
            margin-left: 90px; /* Offset for sidebar */
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
            flex: 1;
        }

        /* --- Top Header Bar --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .header-title-wrapper {
            position: relative;
            display: inline-block;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Sparkles detail */
        .sparkles {
            position: absolute;
            top: 2px;
            right: -28px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sparkle-line {
            background-color: var(--accent-orange);
            height: 4px;
            border-radius: 2px;
        }

        .sparkle-line:nth-child(1) { width: 14px; transform: rotate(45deg); }
        .sparkle-line:nth-child(2) { width: 18px; transform: rotate(0deg); margin-left: 6px; }
        .sparkle-line:nth-child(3) { width: 14px; transform: rotate(-45deg); }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .search-bar {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
        }

        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            color: var(--text-dark);
            font-size: 0.95rem;
            width: 100%;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* --- Main Workspace Section --- */
        .main-workspace {
            background-color: rgba(255, 251, 247, 0.6);
            border: 2px solid var(--card-border);
            border-radius: 28px;
            padding: 35px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
            box-shadow: 0 10px 30px rgba(217, 119, 54, 0.03);
            min-height: 500px;
        }

        /* Quick Stat Row */
        .quick-stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background-color: var(--accent-light-orange);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Workspace Canvas (Primary Area for Custom Content) */
        .content-canvas {
            background: var(--card-bg);
            border: 2px dashed var(--card-border);
            border-radius: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
        }

        .canvas-icon {
            width: 60px;
            height: 60px;
            background-color: var(--accent-light-orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .canvas-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .canvas-desc {
            font-size: 0.95rem;
            max-width: 400px;
            line-height: 1.5;
        }

        /* --- Responsive Design --- */
        @media (max-width: 900px) {
            .quick-stats-row {
                grid-template-columns: 1fr;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .search-bar {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 70px;
                flex-direction: row;
                position: fixed;
                bottom: 0;
                top: auto;
                left: 0;
                padding: 0 20px;
            }
            .sidebar-nav {
                flex-direction: row;
                justify-content: space-around;
            }
            .mascot-avatar {
                margin-bottom: 0;
            }
            .page-wrapper {
                margin-left: 0;
                padding: 25px 20px 90px;
            }
        }
    </style>
</head>
<body>

    <div class="cloud-decoration"></div>

    <!-- Left Fixed Navigation Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-nav">
            <!-- Mascot Profile Header -->
            <div class="mascot-avatar">
                <img src="https://cdn-icons-png.flaticon.com/512/560/560938.png" alt="Mascot Avatar">
            </div>

            <!-- Navigation Links -->
            <a class="nav-item" href="index.html" aria-label="Inicio">
                <svg class="icon-svg" viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </a>
            <a class="nav-item" data-instrument="tiple" href="index_2.html?instrument=tiple" aria-label="Tiple">
                <img src="https://cdn-icons-png.flaticon.com/512/11219/11219593.png" alt="Tiple">
            </a>
            <a class="nav-item" data-instrument="bandola" href="index_2.html?instrument=bandola" aria-label="Bandola">
                <img src="https://cdn-icons-png.flaticon.com/512/6724/6724678.png" alt="Bandola">
            </a>
            <a class="nav-item" data-instrument="guitarra" href="index_2.html?instrument=guitarra" aria-label="Guitarra">
                <img src="https://cdn-icons-png.flaticon.com/512/1894/1894732.png" alt="Guitarra">
            </a>
        </div>

        <!-- Sidebar Footer Action -->
        <div class="sidebar-nav">
            <a class="nav-item" href="/chat" aria-label="Chat">
                <svg class="icon-svg" viewBox="0 0 24 24" style="fill: #f4c295; width: 22px; height: 22px;">
                    <path d="M20 2H4a2 2 0 0 0-2 2v14l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/>
                </svg>
            </a>
            <a class="nav-item" href="index_3.html" aria-label="Estadísticas">
                <svg class="icon-svg" viewBox="0 0 24 24" style="fill: #f4c295; width: 24px; height: 24px;">
                    <path d="M4 21h4V10H4v11zm6 0h4V3h-4v18zm6 0h4v-7h-4v7z"/>
                </svg>
            </a>
        </div>
    </aside>

    <script>
        (function() {
            const selectedInstrument = localStorage.getItem('selectedInstrument');
            if (!selectedInstrument) {
                return;
            }
            document.querySelectorAll('.sidebar-nav .nav-item[data-instrument]').forEach((item) => {
                if (item.dataset.instrument === selectedInstrument) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        })();
    </script>

    <!-- Main Workspace -->
    <div class="page-wrapper">
        <div class="dashboard-container">
            
            <!-- Top Bar Section -->
            <header class="top-bar">
                <div class="header-info">
                    <div class="header-title-wrapper">
                        <h1>Panel Principal</h1>
                        <div class="sparkles">
                            <div class="sparkle-line"></div>
                            <div class="sparkle-line"></div>
                            <div class="sparkle-line"></div>
                        </div>
                    </div>
                    <p class="subtitle">Bienvenido a tu espacio de trabajo personal.</p>
                </div>

                <!-- Search / Filter Component -->
                <div class="search-bar">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="width: 18px; height: 18px;">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <input type="text" placeholder="Buscar lecciones, canciones...">
                </div>
            </header>

            <!-- Main Workspace Canvas -->
            <main class="main-workspace">
                
                <!-- Quick Metric Cards -->
                <div class="quick-stats-row">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg class="icon-svg" viewBox="0 0 24 24">
                                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-title">Módulo Actual</span>
                            <span class="stat-value">Nivel 1: Tiple</span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg class="icon-svg" viewBox="0 0 24 24">
                                <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l2.02 4.53 4.92.42-3.73 3.23L16.23 18z"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-title">Estado</span>
                            <span class="stat-value">En Progreso</span>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg class="icon-svg" viewBox="0 0 24 24">
                                <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-title">Próxima Sesión</span>
                            <span class="stat-value">Hoy, 4:00 PM</span>
                        </div>
                    </div>
                </div>

                <!-- Empty Central Content Canvas -->
                <div class="content-canvas">
                    <div class="canvas-icon">
                        <svg class="icon-svg" viewBox="0 0 24 24" style="width: 28px; height: 28px;">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                    </div>
                    <div class="canvas-title">Espacio Principal de Contenido</div>
                    <div class="canvas-desc">Este contenedor está listo para integrar tus componentes, tablas, ejercicios o contenido dinámico.</div>
                </div>

            </main>
        </div>
    </div>

</body>
</html>
