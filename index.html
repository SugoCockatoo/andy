<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andy</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdf6ec;
            --text-dark: #3a2e2b;
            --accent-orange: #d97736;
            --accent-light-orange: #f4c295;
            --card-bg: #fffbf7;
            --card-border: #f3e5d8;
            --hill-dark: #5b3e31;
            --hill-mid: #b87b56;
            --hill-light: #e5a97a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: var(--text-dark);
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px 100px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* Top Decorative Shapes */
        .sun-decoration {
            position: absolute;
            top: -120px;
            left: -100px;
            width: 300px;
            height: 300px;
            background-color: #fce3ca;
            border-radius: 50%;
            z-index: 1;
            opacity: 0.6;
        }

        .cloud-decoration {
            position: absolute;
            top: 25%;
            left: 5%;
            width: 80px;
            height: 30px;
            background-color: #f8ded0;
            border-radius: 20px;
            opacity: 0.5;
        }

        /* Header Elements */
        .title-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        h1 span {
            color: var(--accent-orange);
        }

        .divider-pill {
            width: 45px;
            height: 6px;
            background-color: var(--accent-orange);
            border-radius: 10px;
            margin: 12px auto 24px;
        }

        .subtitle {
            font-size: 1.25rem;
            font-weight: 500;
            color: #66554e;
            margin-bottom: 50px;
        }

        /* Cards Grid */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            position: relative;
            z-index: 3;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 24px;
            padding: 35px 25px 25px;
            width: 210px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(217, 119, 54, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
                    text-decoration: none;
                    color: inherit;
                }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(217, 119, 54, 0.12);
        }

        .icon-circle {
            width: 110px;
            height: 110px;
            background-color: #fcebd9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .icon-circle img {
            width: 75px;
            height: auto;
            transform: rotate(-30deg);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .card-dash {
            width: 25px;
            height: 4px;
            background-color: var(--accent-orange);
            border-radius: 4px;
        }

        /* Illustration Elements */
        /* Bottom Left Hills */
        .bg-hills-left {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 350px;
            height: 250px;
            z-index: 1;
            pointer-events: none;
        }

        /* Bottom Right Hills */
        .bg-hills-right {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 400px;
            height: 180px;
            z-index: 1;
            pointer-events: none;
        }

        /* Mascot Container */
        .mascot-container {
            position: absolute;
            bottom: 10px;
            right: 4%;
            z-index: 4;
            width: 180px;
            pointer-events: none;
        }

        .mascot-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .cards-container { gap: 15px; }
            .card { width: 100%; max-width: 260px; }
            .mascot-container { display: none; }
        }
    </style>
</head>
<body>

    <!-- Decorative Top Background Elements -->
    <div class="sun-decoration"></div>
    <div class="cloud-decoration"></div>

    <div class="container">
        <!-- Main Header -->
        <div class="title-wrapper">
            <h1>¡Bienvenido a <span>Andy</span>!</h1>
            <div class="sparkles">
                <div class="sparkle-line"></div>
                <div class="sparkle-line"></div>
                <div class="sparkle-line"></div>
            </div>
        </div>
        
        <div class="divider-pill"></div>
        <p class="subtitle">¿Que vamos a aprender hoy?</p>

        <!-- Instrument Cards -->
        <div class="cards-container">
            
            <!-- Card 1: Tiple -->
            <a class="card" href="index_2.html?instrument=tiple">
                <div class="icon-circle">
                    <img src="https://cdn-icons-png.flaticon.com/512/11219/11219593.png" alt="Tiple">
                </div>
                <div class="card-title">Tiple</div>
                <div class="card-dash"></div>
            </a>

            <!-- Card 2: Bandola andina -->
            <a class="card" href="index_2.html?instrument=bandola">
                <div class="icon-circle">
                    <img src="https://cdn-icons-png.flaticon.com/512/6724/6724678.png" alt="Bandola andina">
                </div>
                <div class="card-title">Bandola</div>
                <div class="card-dash"></div>
            </a>

            <!-- Card 3: Guitarra -->
            <a class="card" href="index_2.html?instrument=guitarra">
                <div class="icon-circle">
                    <img src="https://cdn-icons-png.flaticon.com/512/1894/1894732.png" alt="Guitarra">
                </div>
                <div class="card-title">Guitarra</div>
                <div class="card-dash"></div>
            </a>

        </div>
    </div>

    <!-- Bottom Left Vector Waves/Hills -->
    <svg class="bg-hills-left" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-50 300 C 100 280, 120 180, 0 120 C -50 90, -80 120, -100 150 Z" fill="#b87b56"/>
        <path d="M-80 300 C 50 300, 180 260, 100 180 C 40 120, -50 200, -80 300 Z" fill="#e5a97a" opacity="0.7"/>
        <path d="M-100 300 C -20 300, 80 290, 30 230 C -20 170, -80 220, -100 300 Z" fill="#5b3e31"/>
    </svg>

    <!-- Bottom Right Vector Wave -->
    <svg class="bg-hills-right" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M100 200 C 200 150, 300 100, 450 120 L 450 200 Z" fill="#5b3e31"/>
    </svg>

    <!-- Robot Mascot Image -->
    <div class="mascot-container">
        <img src="https://cdn-icons-png.flaticon.com/512/560/560938.png" alt="Andy Mascot">
    </div>

</body>
</html>
