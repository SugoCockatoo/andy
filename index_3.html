<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu progreso - Andy</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdf6ec;
            --text-dark: #3a2e2b;
            --text-muted: #66554e;
            --accent-orange: #d97736;
            --accent-light-orange: #fcebd9;
            --card-bg: #fffbf7;
            --card-border: #f3e5d8;
            --sidebar-dark: #3e2d24;
            --sidebar-active-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            color: var(--text-dark);
        }

        /* Top Cloud Decorative Background */
        .cloud-decoration {
            position: absolute;
            top: 20px;
            right: 40px;
            width: 100px;
            height: 35px;
            background-color: #f8ded0;
            border-radius: 20px;
            opacity: 0.4;
            pointer-events: none;
        }

        /* --- Left Fixed Sidebar --- */
        .sidebar {
            width: 90px;
            background-color: var(--sidebar-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 0;
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
                    gap: 20px;
            width: 100%;
        }

        .mascot-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
                    margin-bottom: 15px;
            cursor: pointer;
        }

        .mascot-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .nav-item {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-decoration: none;
            color: inherit;
        }

                .nav-item:hover {
                    background-color: rgba(255, 255, 255, 0.05);
                    transform: translateY(-2px);
                }

                .nav-item img {
                    width: 30px;
                    height: 30px;
                    object-fit: contain;
                }

                .nav-item.active {
                    background-color: var(--sidebar-active-bg);
                }

                .icon-svg {
                    width: 22px;
                    height: 22px;
                    fill: var(--accent-orange);
                }

        /* --- Main Layout Offset for Left Sidebar --- */
        .page-wrapper {
            flex: 1;
            margin-left: 90px; /* Offset for left fixed sidebar */
            display: flex;
            justify-content: center;
            padding: 40px 60px 40px 40px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1000px;
        }

        /* Header Elements */
        .header {
            margin-bottom: 30px;
            position: relative;
        }

        .title-wrapper {
            position: relative;
            display: inline-block;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Sparkles on Title */
        .sparkles {
            position: absolute;
            top: 2px;
            right: -28px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sparkle-line {
            background-color: var(--accent-orange);
            height: 4px;
            border-radius: 2px;
        }

        .sparkle-line:nth-child(1) { width: 14px; transform: rotate(45deg); }
        .sparkle-line:nth-child(2) { width: 18px; transform: rotate(0deg); margin-left: 6px; }
        .sparkle-line:nth-child(3) { width: 14px; transform: rotate(-45deg); }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-top: 6px;
            font-weight: 400;
        }

        /* Outer Large Dashboard Card */
        .dashboard-card {
            background-color: rgba(255, 251, 247, 0.6);
            border: 2px solid var(--card-border);
            border-radius: 28px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            box-shadow: 0 10px 30px rgba(217, 119, 54, 0.03);
        }

        /* --- Top Metrics Grid --- */
        .metrics-grid {
            display: grid;
            grid-template-columns: 220px repeat(4, 1fr);
            gap: 16px;
            align-items: center;
        }

        /* Empty Circle Progress Widget (Background Ring Only) */
        .circle-progress-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .circle-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #fce3ca; /* Neutral empty ring */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .circle-inner {
            width: 112px;
            height: 112px;
            background-color: var(--bg-color);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .percentage {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1;
        }

        .percentage-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* Metric Cards */
        .metric-card {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 20px;
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
            transition: transform 0.2s;
        }

        .metric-card:hover {
            transform: translateY(-3px);
        }

        .metric-icon-circle {
            width: 52px;
            height: 52px;
            background-color: var(--accent-light-orange);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .metric-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.1;
        }

        .metric-label {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* --- Daily Evolution Chart Card (Empty) --- */
        .chart-card {
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
        }

        .chart-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 20px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 180px;
        }

        /* Y-Axis Labels */
        .y-axis {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #9e8d85;
            font-weight: 500;
        }

        /* Chart SVG Area */
        .chart-svg-wrapper {
            position: absolute;
            left: 45px;
            right: 0;
            top: 0;
            bottom: 30px;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Grid lines */
        .grid-line {
            stroke: #f3e5d8;
            stroke-dasharray: 4,4;
            stroke-width: 1;
        }

        /* X-Axis Labels */
        .x-axis {
            position: absolute;
            left: 45px;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Responsive Adjustments */
        @media (max-width: 1024px) {
            .metrics-grid {
                grid-template-columns: 1fr 1fr;
            }
            .circle-progress-card {
                grid-column: span 2;
                margin-bottom: 15px;
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 70px;
                flex-direction: row;
                position: fixed;
                bottom: 0;
                top: auto;
                left: 0;
                padding: 0 20px;
            }
            .sidebar-nav {
                flex-direction: row;
                justify-content: space-around;
            }
            .page-wrapper {
                margin-left: 0;
                padding: 20px 20px 90px;
            }
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            .circle-progress-card {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <!-- Left Navigation Sidebar -->
<!-- Left Fixed Navigation Sidebar -->

            <a class="nav-item" href="index.html" aria-label="Inicio">

</body>
